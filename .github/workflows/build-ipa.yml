name: Sestavit IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Nainstalovat XcodeGen
        run: brew install xcodegen
      - name: Vygenerovat Xcode projekt
        run: xcodegen generate
      - name: Sestavit (bez podpisu)
        run: |
          xcodebuild -project KontrolaOM.xcodeproj -scheme KontrolaOM \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Zabalit do .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KontrolaOM.app Payload/
          zip -qry KontrolaOM.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KontrolaOM-ipa
          path: KontrolaOM.ipa
      - name: Zveřejnit .ipa ke stažení (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest KontrolaOM.ipa --title "Kontrola OM – poslední sestavení" \
            --notes "Sestaveno z commitu ${GITHUB_SHA::7}. Nainstalujte přes Sideloadly (viz README)."
