name: KontrolaOM
options:
  bundleIdPrefix: cz.monter
  deploymentTarget:
    iOS: "15.0"
targets:
  KontrolaOM:
    type: application
    platform: iOS
    sources:
      - path: KontrolaOM
        excludes: ["Web/**", "Info.plist"]
      - path: KontrolaOM/Web
        type: folder
        buildPhase: resources
    info:
      path: KontrolaOM/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.monter.kontrolaom
        MARKETING_VERSION: "1.17"
        CURRENT_PROJECT_VERSION: "19"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Kontrola OM"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "Fotka rozváděče slouží k rozpoznání přístrojů a předvyplnění kontroly."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Výběr fotky rozváděče k rozpoznání přístrojů."
        SWIFT_VERSION: "5.0"
